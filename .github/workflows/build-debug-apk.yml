name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # "Bundle" = alle emulator-cores zitten in de APK, dus direct installeerbaar.
      - name: Build debug APK
        run: ./gradlew assembleFreeBundleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lemuroid-verplaatsbaar-scherm-apk
          path: lemuroid-app/build/outputs/apk/freeBundle/debug/*.apk
